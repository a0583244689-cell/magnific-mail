
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שליחת תמונות למייל</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .panel {
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 8px 30px #00294d18;
      width: min(85%, 420px);
      text-align: center;
    }
    h1 { color: #00294d; font-size: 25px; }
    p { color: #555; line-height: 1.6; }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      font-size: 16px;
      margin-top: 14px;
    }
    input { border: 1px solid #ccd4df; }
    button {
      background: #00294d;
      color: white;
      border: none;
      cursor: pointer;
    }
    button:hover { background: #12466e; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { font-size: 14px; }
  </style>
</head>
<body>
  <div class="panel">
    <h1>שליחת תמונות ממגניפיק</h1>
    <p>הדביקי קישור לתמונה והכניסי את הסיסמה שלך</p>

    <form id="sendForm">
      <input id="imageUrl" type="url"
             placeholder="הדביקי כאן קישור לתמונה"
             required>

      <input id="password" type="password"
             placeholder="הכניסי סיסמה"
             autocomplete="off" required>

      <button id="sendButton" type="submit">
        ✉ שלחי למייל
      </button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </div>

  <script>
    const endpoint =
      "https://magnific-mail-gateway.a0583244689.workers.dev/";

    document.getElementById("sendForm")
      .addEventListener("submit", async function(event) {
        event.preventDefault();

        const imageUrl =
          document.getElementById("imageUrl").value.trim();
        const password =
          document.getElementById("password").value;
        const status = document.getElementById("status");
        const button = document.getElementById("sendButton");

        button.disabled = true;
        status.textContent = "שולחת את הבקשה...";

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              image_url: imageUrl,
              password: password
            })
          });

          if (response.status === 401) {
            status.textContent = "הסיסמה שגויה.";
          } else if (response.status === 400) {
            status.textContent =
              "הקישור לתמונה אינו תקין או אינו נתמך.";
          } else if (response.ok) {
            status.textContent =
              "הבקשה התקבלה! בדקי את המייל בעוד רגע.";
            document.getElementById("password").value = "";
          } else {
            status.textContent =
              "אירעה שגיאה בשליחה. נסי שוב.";
          }
        } catch (error) {
          status.textContent =
            "לא ניתן להתחבר לשירות השליחה.";
        } finally {
          button.disabled = false;
        }
      });
  </script>
</body>
</html>
